name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify (JVM Suite)
    # tools/build-discovery-tokenizer.ps1 requires Windows host tools and an MSVC Rust target.
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1" "ndk;29.0.13846066"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK dependency installation failed" }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-linux-android,x86_64-linux-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: .\gradlew.bat :app:testDebugUnitTest --stacktrace

      - name: Compile Instrumented Tests
        run: .\gradlew.bat :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble Debug APK
        run: .\gradlew.bat :app:assembleDebug --stacktrace
