org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AGP's connected-test cleanup otherwise uninstalls even a previously installed target app.
# Preserve local reader data and external model packs after repository-wrapper device tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true
