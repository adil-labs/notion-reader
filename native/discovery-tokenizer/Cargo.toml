[package]
name = "discovery-tokenizer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "discovery_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
sentencepiece = { version = "=0.14.0", features = ["static"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
strip = "symbols"
