[package]
name = "discovery-tokenizer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "discovery_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
tokenizers = { version = "=0.22.1", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
strip = "symbols"
